# `segarecomp mod test` scenarios of the gameplay example (SEG-136-T007, ADR 0300). The file belongs to the PROJECT: it is never packed and never part of a package identity.
# Every scenario is bounded by an explicit instruction budget and wall-clock timeout, replays a scripted pad ("<frame>:<player>:<mask>[,...]"; 0x20 = button C, 0x08 = Right, 0x10 = B)
# and compares what the MODDED program did. The per-frame RAM expectations below are derived by hand from the two rules (the fixture adds 1 per frame to the score while B is held and
# to the position while Right is held; the mod adds 10 to the score per frame while C is held), not copied from a run.

[[scenario]]
name = "bonus-while-c-held"
frames = 24
budget = 4000000
timeout = 60
input = "10:1:0x20,20:1:0x00"
ram = ["16:4"]
checkpoint = 15
expect_ram_frames = ["00000000", "00000000", "00000000", "00000000", "00000000", "00000000", "00000000", "00000000", "00000000", "00000000", "000a0000", "00140000", "001e0000", "00280000", "00320000", "003c0000", "00460000", "00500000", "005a0000", "00640000", "00640000", "00640000", "00640000", "00640000"]
expect_state = "8826167e22e10398ab498dc510001b23878fcc2e0dee24727ed1bcba26790f02"

