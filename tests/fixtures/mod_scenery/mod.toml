# SEG-140-T011: test package of the ABI 2 scenery transport (fixture image: scenery_fixture_rom.py). Native code: approval of this exact identity is the boundary.
[mod]
id = "scenery-fixture-native"
author = "segarecomp tests"
version = "0.1.0"
name = "Scenery fixture (native)"
license = "CC0-1.0"

[target]
platform = "genesis"

[[target.revision]]
label = "fixture"
sha256 = "@@SHA@@"

[[source]]
kind = "native-c11"
path = "src/provider.c"

[abi]
native = 2

[capabilities]
required = ["memory.read.m68k.work_ram", "overlay.rgba", "scenery.words", "state.mod"]

[state]
schema = 1

[[memory]]
revision = "fixture"
space = "m68k.work_ram"
offset = 18
length = 2
access = "read"

[geometry]
aspect_max = "32:9"

[[scene]]
id = "main"
components = ["scenery", "hud"]
