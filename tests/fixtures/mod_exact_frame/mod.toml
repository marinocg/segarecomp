# SEG-152-T003: test package of the exact-frame producer test (fixture image: tests/fixtures/mod_scenery/scenery_fixture_rom.py, mid_frame=True). Native code: approval of this exact identity is the boundary.
[mod]
id = "exact-frame-probe"
author = "segarecomp tests"
version = "0.1.0"
