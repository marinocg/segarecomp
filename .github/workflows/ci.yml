name: ci

on:
  workflow_call:
  pull_request:
    # ready_for_review re-triggers the run when a draft is promoted.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

# Only a superseded run of the SAME pull request is cancelled. Every other event (a push to main, a tag validated through release.yml's
# workflow_call, a manual dry run) gets a group made unique by its run id, so it is neither cancelled nor queued behind another run.
# `github.event_name` and `github.run_id` are the caller's when this workflow is called, and the literal `ci-` prefix keeps the group
# distinct from any caller group (a called workflow whose group equals its caller's would be cancelled by it), so a reusable invocation can
# never cancel its caller. A draft promoted with `ready_for_review` starts a new run for the same head; the older run of that PR was
# draft-skipped and has nothing to lose. The newest run of a PR head always runs to completion, so the required checks of the final head exist.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('{0}-{1}', github.event_name, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    # Save Actions quota: draft PRs do not run the matrix (pushes to main always do).
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    # Wall-clock: every job builds once and runs one deterministic, cost-balanced selection of the hermetic tests' shards (`shard-N` CTest
    # labels, tests/ci_shards.cmake): job `j/J` of a host runs the shards j, j+J, j+2J, ... of the 35. A stride (not a consecutive range) because
    # the cost balance fills the lowest-numbered shards with the heaviest tests first. The union of the shards is the `full` tier (which
    # contains `fast`); the guard test `ci_shard_guard_test` (in `fast` and `full`) fails if a test has no shard, a shard is over budget, or a
    # host's jobs below do not cover the 35 shards exactly once.
    # Job count per host is chosen against two hosted-runner limits that a measured run exposed: a free-plan account runs at most 20 jobs at
    # once (the 21st waits for a free runner) and at most 5 of them on macOS, so a run is sized to fit (7 Linux + 5 Windows + 4 macOS shard jobs
    # and 4 viewer jobs = 20). Linux (GCC) tests are ~1.5x slower than the same tests on Windows or macOS, hence the most jobs.
    name: ${{ matrix.name }} job ${{ matrix.job }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Linux (GCC + Ninja)", os: ubuntu-24.04, host: linux, job: "1/7" }
          - { name: "Linux (GCC + Ninja)", os: ubuntu-24.04, host: linux, job: "2/7" }
          - { name: "Linux (GCC + Ninja)", os: ubuntu-24.04, host: linux, job: "3/7" }
          - { name: "Linux (GCC + Ninja)", os: ubuntu-24.04, host: linux, job: "4/7" }
          - { name: "Linux (GCC + Ninja)", os: ubuntu-24.04, host: linux, job: "5/7" }
          - { name: "Linux (GCC + Ninja)", os: ubuntu-24.04, host: linux, job: "6/7" }
          - { name: "Linux (GCC + Ninja)", os: ubuntu-24.04, host: linux, job: "7/7" }
          - { name: "Windows (LLVM/Clang + Ninja)", os: windows-latest, host: windows, job: "1/5" }
          - { name: "Windows (LLVM/Clang + Ninja)", os: windows-latest, host: windows, job: "2/5" }
          - { name: "Windows (LLVM/Clang + Ninja)", os: windows-latest, host: windows, job: "3/5" }
          - { name: "Windows (LLVM/Clang + Ninja)", os: windows-latest, host: windows, job: "4/5" }
          - { name: "Windows (LLVM/Clang + Ninja)", os: windows-latest, host: windows, job: "5/5" }
          - { name: "macOS (AppleClang + Ninja)", os: macos-latest, host: macos, job: "1/4" }
          - { name: "macOS (AppleClang + Ninja)", os: macos-latest, host: macos, job: "2/4" }
          - { name: "macOS (AppleClang + Ninja)", os: macos-latest, host: macos, job: "3/4" }
          - { name: "macOS (AppleClang + Ninja)", os: macos-latest, host: macos, job: "4/4" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja
      - name: Install Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Windows MSVC environment (for the LLVM/Clang route)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Select Windows compiler
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "CC=clang" >> "$GITHUB_ENV"
          echo "CXX=clang++" >> "$GITHUB_ENV"
      - name: Record toolchain versions
        shell: bash
        run: |
          cmake --version | head -1
          ninja --version
          python --version
          ${CXX:-c++} --version | head -2
          ${CC:-cc} --version | head -2
      - name: Configure
        run: cmake --preset dev
      - name: Build
        run: cmake --build --preset dev -- -k 0
      - name: Hermetic tests (job ${{ matrix.job }}: shards j, j+J, ... of 35)
        # Run without the developer preset's stop-on-failure so CI reports every failing test of the job. The shard labels cover
        # `fast` and `full` together (`fast` is a subset of `full`), so no test runs twice and none is skipped.
        shell: bash
        run: |
          job="${{ matrix.job }}"
          labels="^shard-($(seq -s '|' "${job%/*}" "${job#*/}" 35))$"
          echo "ctest label selection: $labels"
          ctest --test-dir build/dev -L "$labels" -j 4 --output-on-failure --no-tests=error

  sdl3-viewer:
    # Save Actions quota: draft PRs do not run the matrix (pushes to main always do).
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    # The optional SDL3 presenter must configure and build on every host; SDL3 is
    # provisioned through vcpkg (preinstalled on hosted runners), never vendored.
    # The viewer/launcher suites were the longest single job on Linux (~19 min: the four GUI journeys alone are ~8 min each under contention).
    # Linux therefore runs them in two parts: `gui` is those four tests, `rest` is the same selection minus them (ctest -E), so the union is
    # exactly the original selection and a mistyped `gui` name can only run extra tests, never drop one. Windows (~17 min) and macOS (~13 min)
    # stay one job each: the run is sized to the 20 concurrent jobs (5 on macOS) of a free-plan account, see build-test.
    name: SDL3 viewer (${{ matrix.name }}${{ matrix.part && format(', {0}', matrix.part) || '' }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
          - name: Linux
            os: ubuntu-24.04
            part: gui
          - name: Linux
            os: ubuntu-24.04
            part: rest
          - name: Windows
            os: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja and SDL3 build prerequisites (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja
      - name: Install Ninja and SDL3 build prerequisites (Linux)
        if: runner.os == 'Linux'
        run: >
          sudo apt-get update && sudo apt-get install -y ninja-build pkg-config autoconf autoconf-archive automake libtool libltdl-dev
          libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev
          libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev libdrm-dev libgbm-dev
          libgl1-mesa-dev libegl1-mesa-dev libasound2-dev libpulse-dev libudev-dev
          libdbus-1-dev libdecor-0-dev libibus-1.0-dev
      - name: Windows MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Cache vcpkg downloads and binaries
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/vcpkg-binary-cache
            ${{ runner.os == 'Windows' && 'C:/vcpkg/downloads' || '/usr/local/share/vcpkg/downloads' }}
          key: vcpkg-sdl3-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml', '.github/scripts/vcpkg_gnu_mirror.sh') }}
          restore-keys: vcpkg-sdl3-${{ runner.os }}-
      - name: Install SDL3 (macOS/Linux/Windows via vcpkg)
        shell: bash
        env:
          VCPKG_DEFAULT_BINARY_CACHE: ${{ runner.temp }}/vcpkg-binary-cache
          # GNU hosts (ftp.gnu.org / ftpmirror.gnu.org) are occasionally unreachable; try other mirrors first.
          # vcpkg still verifies every SHA-512 and falls back to the original URL.
          X_VCPKG_ASSET_SOURCES: "x-script,bash ${{ github.workspace }}/.github/scripts/vcpkg_gnu_mirror.sh {url} {dst}"
        run: |
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          "$VCPKG_INSTALLATION_ROOT/vcpkg" install sdl3
      - name: Configure with the SDL3 viewer
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then export CC=clang CXX=clang++; fi
          hint="-DCMAKE_TOOLCHAIN_FILE=$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          cmake -S . -B build/sdl3 -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DSEGARECOMP_WARNINGS_AS_ERRORS=ON -DSEGARECOMP_ENABLE_SDL3_VIEWER=ON -DSEGARECOMP_BUILD_LAUNCHER=ON -DBUILD_TESTING=ON $hint
      - name: Build the SDL3 viewer targets (Genesis, Master System) and the consumer launcher
        run: cmake --build build/sdl3 --target segarecomp_viewer_genesis_sdl3 segarecomp_viewer_sega_cd_sdl3 segarecomp_viewer_master_system_sdl3 segarecomp_viewer_master_system_main_check segarecomp-launcher launcher_policy_test launcher_sms_policy_test library_catalog_test cartridge_recognition_test storage_test launcher_ui_support_test launcher_build_cancel_test older_build_test file_picker_test sv_host_test sv_state_test sv_state_service_test sv_viewer_core_test sv_input_diag_test fake_segarecomp fake_game fake_scd_program launcher_sega_cd_test segarecomp
      - name: Run the launcher AOT-policy test and the SEG-058 library, storage and viewer-host tests (CTest; dummy video driver, no packaging dependency)
        shell: bash
        run: |
          # SDL3 runtime libraries from vcpkg must be findable by the test binary on Windows (a plain test step, never POST_BUILD).
          for d in "$VCPKG_INSTALLATION_ROOT"/installed/*/bin; do [ -d "$d" ] && export PATH="$d:$PATH"; done
          selection='^(launcher_(sms_)?policy_test|cartridge_recognition_test|launcher_lock_on_[a-z]*_test|launcher_sega_cd(_flow|_gui)?_test|sega_cd_viewer_sdl_test|packaging_no_game_content_test|launcher_build_cancel(_gui)?_test|launcher_default_mode_test|older_build_test|file_picker_test|launcher_gamepad_journey_[a-z_]*_narrow_test|launcher_parity_gui_[a-z_]*_narrow_test|library_catalog_test|storage_test|launcher_ui_support_test|sv_host_test|sv_state_test|sv_state_service_test|sms_viewer_states_test|sega_cd_viewer_states_test|sv_viewer_core_test|sv_input_diag_test|launcher_gui_navigation_test|launcher_audio_gui_test|launcher_input_diagnostics_test|viewer_foundation_layout_test|ci_shard_guard_test)$'
          heavy='^(launcher_sega_cd_gui_test|launcher_parity_gui_journey_narrow_test|launcher_parity_gui_persist_narrow_test|launcher_gui_navigation_test)$'
          case "${{ matrix.part || 'all' }}" in
            all)  ctest --test-dir build/sdl3 -j 4 -R "$selection" --no-tests=error --output-on-failure ;;
            gui)  ctest --test-dir build/sdl3 -j 4 -R "$heavy" --no-tests=error --output-on-failure ;;
            rest) ctest --test-dir build/sdl3 -j 4 -R "$selection" -E "$heavy" --no-tests=error --output-on-failure ;;
          esac
