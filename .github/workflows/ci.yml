name: ci

on:
  workflow_call:
  pull_request:
    # ready_for_review re-triggers the run when a draft is promoted.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    # Save Actions quota: draft PRs do not run the matrix (pushes to main always do).
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    # Wall-clock: every job (host x shard) builds once and runs one deterministic, cost-balanced partition of the hermetic tests
    # (`shard-N` CTest labels, tests/ci_shards.cmake). The union of the shards is the `full` tier (which contains `fast`); the guard test
    # `ci_shard_guard_test` (in `fast` and `full`) fails if a test has no shard, a shard is over budget, or this matrix is out of date.
    name: ${{ matrix.name }} shard ${{ matrix.shard }}/6
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        host: [macos, linux, windows]
        shard: [1, 2, 3, 4, 5, 6]
        include:
          - host: macos
            name: macOS (AppleClang + Ninja)
            os: macos-latest
          - host: linux
            name: Linux (GCC + Ninja)
            os: ubuntu-24.04
          - host: windows
            name: Windows (LLVM/Clang + Ninja)
            os: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja
      - name: Install Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Windows MSVC environment (for the LLVM/Clang route)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Select Windows compiler
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "CC=clang" >> "$GITHUB_ENV"
          echo "CXX=clang++" >> "$GITHUB_ENV"
      - name: Record toolchain versions
        shell: bash
        run: |
          cmake --version | head -1
          ninja --version
          python --version
          ${CXX:-c++} --version | head -2
          ${CC:-cc} --version | head -2
      - name: Configure
        run: cmake --preset dev
      - name: Build
        run: cmake --build --preset dev -- -k 0
      - name: Hermetic tests (shard ${{ matrix.shard }}/6)
        # Run without the developer preset's stop-on-failure so CI reports every failing test of the shard. The shard labels cover
        # `fast` and `full` together (`fast` is a subset of `full`), so no test runs twice and none is skipped.
        run: ctest --test-dir build/dev -L "^shard-${{ matrix.shard }}$" -j 4 --output-on-failure --no-tests=error

  sdl3-viewer:
    # Save Actions quota: draft PRs do not run the matrix (pushes to main always do).
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    # The optional SDL3 presenter must configure and build on every host; SDL3 is
    # provisioned through vcpkg (preinstalled on hosted runners), never vendored.
    name: SDL3 viewer (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
          - name: Linux
            os: ubuntu-24.04
          - name: Windows
            os: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja and SDL3 build prerequisites (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja
      - name: Install Ninja and SDL3 build prerequisites (Linux)
        if: runner.os == 'Linux'
        run: >
          sudo apt-get update && sudo apt-get install -y ninja-build pkg-config autoconf autoconf-archive automake libtool libltdl-dev
          libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev
          libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev libdrm-dev libgbm-dev
          libgl1-mesa-dev libegl1-mesa-dev libasound2-dev libpulse-dev libudev-dev
          libdbus-1-dev libdecor-0-dev libibus-1.0-dev
      - name: Windows MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Cache vcpkg downloads and binaries
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/vcpkg-binary-cache
            ${{ runner.os == 'Windows' && 'C:/vcpkg/downloads' || '/usr/local/share/vcpkg/downloads' }}
          key: vcpkg-sdl3-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml', '.github/scripts/vcpkg_gnu_mirror.sh') }}
          restore-keys: vcpkg-sdl3-${{ runner.os }}-
      - name: Install SDL3 (macOS/Linux/Windows via vcpkg)
        shell: bash
        env:
          VCPKG_DEFAULT_BINARY_CACHE: ${{ runner.temp }}/vcpkg-binary-cache
          # GNU hosts (ftp.gnu.org / ftpmirror.gnu.org) are occasionally unreachable; try other mirrors first.
          # vcpkg still verifies every SHA-512 and falls back to the original URL.
          X_VCPKG_ASSET_SOURCES: "x-script,bash ${{ github.workspace }}/.github/scripts/vcpkg_gnu_mirror.sh {url} {dst}"
        run: |
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          "$VCPKG_INSTALLATION_ROOT/vcpkg" install sdl3
      - name: Configure with the SDL3 viewer
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then export CC=clang CXX=clang++; fi
          hint="-DCMAKE_TOOLCHAIN_FILE=$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          cmake -S . -B build/sdl3 -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DSEGARECOMP_WARNINGS_AS_ERRORS=ON -DSEGARECOMP_ENABLE_SDL3_VIEWER=ON -DSEGARECOMP_BUILD_LAUNCHER=ON -DBUILD_TESTING=ON $hint
      - name: Build the SDL3 viewer targets (Genesis, Master System) and the consumer launcher
        run: cmake --build build/sdl3 --target segarecomp_viewer_genesis_sdl3 segarecomp_viewer_sega_cd_sdl3 segarecomp_viewer_master_system_sdl3 segarecomp_viewer_master_system_main_check segarecomp-launcher launcher_policy_test launcher_sms_policy_test library_catalog_test storage_test launcher_ui_support_test launcher_build_cancel_test older_build_test file_picker_test sv_host_test sv_viewer_core_test sv_input_diag_test fake_segarecomp fake_game fake_scd_program launcher_sega_cd_test segarecomp
      - name: Run the launcher AOT-policy test and the SEG-058 library, storage and viewer-host tests (CTest; dummy video driver, no packaging dependency)
        shell: bash
        run: |
          # SDL3 runtime libraries from vcpkg must be findable by the test binary on Windows (a plain test step, never POST_BUILD).
          for d in "$VCPKG_INSTALLATION_ROOT"/installed/*/bin; do [ -d "$d" ] && export PATH="$d:$PATH"; done
          ctest --test-dir build/sdl3 -j 4 -R '^(launcher_(sms_)?policy_test|launcher_sega_cd(_flow|_gui)?_test|sega_cd_viewer_sdl_test|packaging_commercial_content_test|launcher_build_cancel(_gui)?_test|launcher_default_mode_test|older_build_test|file_picker_test|launcher_gamepad_journey_[a-z_]*_narrow_test|library_catalog_test|storage_test|launcher_ui_support_test|sv_host_test|sv_viewer_core_test|sv_input_diag_test|launcher_gui_navigation_test|launcher_input_diagnostics_test|viewer_foundation_layout_test|ci_shard_guard_test)$' --no-tests=error --output-on-failure
